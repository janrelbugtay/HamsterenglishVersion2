<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mystery Box Game</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
      @keyframes floatUp {
        0% {
          transform: translateY(0) scale(0.5) rotate(0deg);
          opacity: 1;
        }
        100% {
          transform: translateY(-120vh) scale(1.5) rotate(360deg);
          opacity: 0;
        }
      }
      @keyframes dropDown {
        0% {
          transform: translateY(0) scale(1) rotate(0deg);
          opacity: 1;
        }
        100% {
          transform: translateY(120vh) scale(0.5) rotate(-90deg);
          opacity: 0;
        }
      }
      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        20%,
        60% {
          transform: translateX(-10px);
        }
        40%,
        80% {
          transform: translateX(10px);
        }
      }
      @keyframes confettiFall {
        0% {
          transform: translateY(-20vh) rotate(0deg);
          opacity: 1;
        }
        100% {
          transform: translateY(120vh) rotate(720deg);
          opacity: 0;
        }
      }

      .animate-float-up {
        animation: floatUp 2.5s ease-out forwards;
      }
      .animate-drop-down {
        animation: dropDown 2.5s ease-in forwards;
      }
      .animate-shake {
        animation: shake 0.5s ease-in-out;
      }
      .animate-confetti {
        animation: confettiFall linear infinite;
      }

      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }

      .animate-in {
        animation: fadeIn 0.3s ease-out;
      }
      .zoom-in-95 {
        animation: zoomIn 0.3s ease-out;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes zoomIn {
        from {
          transform: scale(0.95);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }
    
      @keyframes boxGlow {
        0%, 100% { box-shadow: 0 0 15px rgba(251,191,36,0.4); }
        50% { box-shadow: 0 0 30px rgba(251,191,36,0.8); }
      }
      .animate-box-glow {
        animation: boxGlow 2s infinite;
      }
      @keyframes popIn {
        0% { transform: scale(0.5); opacity: 0; }
        70% { transform: scale(1.1); }
        100% { transform: scale(1); opacity: 1; }
      }
      .animate-pop-in {
        animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      }
      @keyframes floatParticle {
        0% { transform: translateY(0) scale(1); opacity: 1; }
        100% { transform: translateY(-50px) scale(0); opacity: 0; }
      }
</style>
  </head>
  <body class="text-slate-800 font-sans">
    <div id="app-root"></div>

    <script>
      // --- SOUND SYNTHESIZER ---
      const playSound = (type, isMuted) => {
        if (isMuted) return;
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (!AudioContext) return;
          const ctx = new AudioContext();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.connect(gain);
          gain.connect(ctx.destination);

          if (type === "click") {
            osc.type = "sine";
            osc.frequency.setValueAtTime(600, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(
              300,
              ctx.currentTime + 0.1,
            );
            gain.gain.setValueAtTime(0.1, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(
              0.001,
              ctx.currentTime + 0.1,
            );
            osc.start();
            osc.stop(ctx.currentTime + 0.1);
                    } else if (type === "hover") {
            osc.type = "sine";
            osc.frequency.setValueAtTime(800, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1000, ctx.currentTime + 0.05);
            gain.gain.setValueAtTime(0.02, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
            osc.start();
            osc.stop(ctx.currentTime + 0.05);
          } else if (type === "suspense") {
            osc.type = "triangle";
            osc.frequency.setValueAtTime(100, ctx.currentTime);
            osc.frequency.linearRampToValueAtTime(150, ctx.currentTime + 1.0);
            gain.gain.setValueAtTime(0.1, ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0.0, ctx.currentTime + 1.0);
            osc.start();
            osc.stop(ctx.currentTime + 1.0);
          } else if (type === "correct") {
            osc.type = "sine";
            osc.frequency.setValueAtTime(523.25, ctx.currentTime);
            osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
            osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.1, ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.4);
            osc.start();
            osc.stop(ctx.currentTime + 0.4);
          } else if (type === "incorrect") {
            osc.type = "sawtooth";
            osc.frequency.setValueAtTime(150, ctx.currentTime);
            osc.frequency.linearRampToValueAtTime(100, ctx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.1, ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.3);
            osc.start();
            osc.stop(ctx.currentTime + 0.3);
          } else if (type === "reveal") {
            osc.type = "square";
            osc.frequency.setValueAtTime(440, ctx.currentTime);
            osc.frequency.setValueAtTime(554.37, ctx.currentTime + 0.1);
            osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.2);
            osc.frequency.setValueAtTime(880, ctx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.05, ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.6);
            osc.start();
            osc.stop(ctx.currentTime + 0.6);
          } else if (type === "win") {
            osc.type = "square";
            osc.frequency.setValueAtTime(440, ctx.currentTime);
            osc.frequency.setValueAtTime(554.37, ctx.currentTime + 0.15);
            osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.3);
            osc.frequency.setValueAtTime(880, ctx.currentTime + 0.45);
            osc.frequency.setValueAtTime(1108.73, ctx.currentTime + 0.6);
            gain.gain.setValueAtTime(0.1, ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 1.0);
            osc.start();
            osc.stop(ctx.currentTime + 1.0);
          } else if (type === "lose") {
            osc.type = "sawtooth";
            osc.frequency.setValueAtTime(300, ctx.currentTime);
            osc.frequency.linearRampToValueAtTime(200, ctx.currentTime + 0.4);
            osc.frequency.setValueAtTime(200, ctx.currentTime + 0.4);
            osc.frequency.linearRampToValueAtTime(100, ctx.currentTime + 0.9);
            gain.gain.setValueAtTime(0.15, ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0.1, ctx.currentTime + 0.4);
            gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.9);
            osc.start();
            osc.stop(ctx.currentTime + 0.9);
          } else if (type === "grand_win") {
            osc.type = "square";
            osc.frequency.setValueAtTime(523.25, ctx.currentTime);
            osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.2);
            osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.4);
            osc.frequency.setValueAtTime(1046.5, ctx.currentTime + 0.6);
            gain.gain.setValueAtTime(0.15, ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 2.0);
            osc.start();
            osc.stop(ctx.currentTime + 2.0);
          }
        } catch (e) {
          console.error("Audio playback failed:", e);
        }
      };

      // --- GLOBAL DATA & CONSTANTS ---
      
      const OUTCOMES_NORMAL = [
        { id: "add100", text: "+100 points", icon: `<i data-lucide="star" class="w-10 h-10 text-yellow-100"></i>`, color: "bg-teal-500 shadow-teal-500/40", action: (teams, tIdx) => { teams[tIdx].score += 100; return teams; } },
        { id: "add200", text: "+200 points", icon: `<i data-lucide="star" class="w-10 h-10 text-yellow-100"></i>`, color: "bg-green-500 shadow-green-500/40", action: (teams, tIdx) => { teams[tIdx].score += 200; return teams; } },
        { id: "add300", text: "+300 points", icon: `<i data-lucide="star" class="w-10 h-10 text-yellow-100"></i>`, color: "bg-emerald-500 shadow-emerald-500/40", action: (teams, tIdx) => { teams[tIdx].score += 300; return teams; } },
        { id: "sub50", text: "-50 points", icon: `<i data-lucide="cloud-rain" class="w-10 h-10 text-white"></i>`, color: "bg-red-400 shadow-red-400/40", action: (teams, tIdx) => { teams[tIdx].score -= 50; return teams; } },
        { id: "sub100", text: "-100 points", icon: `<i data-lucide="alert-triangle" class="w-10 h-10 text-white"></i>`, color: "bg-red-500 shadow-red-500/40", action: (teams, tIdx) => { teams[tIdx].score -= 100; return teams; } },
        { id: "add50", text: "+50 points", icon: `<i data-lucide="star" class="w-10 h-10 text-yellow-100"></i>`, color: "bg-cyan-500 shadow-cyan-500/40", action: (teams, tIdx) => { teams[tIdx].score += 50; return teams; } },
      ];

      const OUTCOMES_MEDIUM = [
        ...OUTCOMES_NORMAL,
        { id: "add500", text: "+500 points", icon: `<i data-lucide="award" class="w-10 h-10 text-yellow-100"></i>`, color: "bg-green-600 shadow-green-600/40", action: (teams, tIdx) => { teams[tIdx].score += 500; return teams; } },
        { id: "sub200", text: "-200 points", icon: `<i data-lucide="alert-triangle" class="w-10 h-10 text-white"></i>`, color: "bg-rose-600 shadow-rose-600/40", action: (teams, tIdx) => { teams[tIdx].score -= 200; return teams; } },
        { 
          id: "swap_team", 
          text: "Swap Points", 
          icon: `<i data-lucide="arrow-right-left" class="w-10 h-10 text-white"></i>`, 
          color: "bg-purple-500 shadow-purple-500/40", 
          requiresTarget: "swap",
          action: (teams, tIdx, targetIdx) => { 
            let temp = teams[tIdx].score;
            teams[tIdx].score = teams[targetIdx].score;
            teams[targetIdx].score = temp;
            return teams; 
          } 
        },
        { 
          id: "steal_100", 
          text: "Steal 100", 
          icon: `<i data-lucide="grab" class="w-10 h-10 text-white"></i>`, 
          color: "bg-indigo-500 shadow-indigo-500/40", 
          requiresTarget: "steal",
          action: (teams, tIdx, targetIdx) => { 
            if (teams[targetIdx].score >= 100) {
              teams[targetIdx].score -= 100;
              teams[tIdx].score += 100;
            } else {
              teams[tIdx].score += Math.max(0, teams[targetIdx].score);
              teams[targetIdx].score = 0;
            }
            return teams; 
          } 
        },
      ];

      const OUTCOMES_DIFFICULT = [
        ...OUTCOMES_MEDIUM,
        { id: "sub500", text: "-500 points", icon: `<i data-lucide="skull" class="w-10 h-10 text-white"></i>`, color: "bg-red-700 shadow-red-700/40", action: (teams, tIdx) => { teams[tIdx].score -= 500; return teams; } },
        { 
          id: "swap_team_high", 
          text: "Swap Points", 
          icon: `<i data-lucide="arrow-right-left" class="w-10 h-10 text-white"></i>`, 
          color: "bg-fuchsia-600 shadow-fuchsia-600/40", 
          requiresTarget: "swap",
          action: (teams, tIdx, targetIdx) => { 
            let temp = teams[tIdx].score;
            teams[tIdx].score = teams[targetIdx].score;
            teams[targetIdx].score = temp;
            return teams; 
          } 
        },
        { 
          id: "minus_10_percent", 
          text: "-10% Points", 
          icon: `<i data-lucide="percent" class="w-10 h-10 text-white"></i>`, 
          color: "bg-orange-500 shadow-orange-500/40", 
          action: (teams, tIdx) => { 
            teams[tIdx].score -= Math.floor(Math.max(0, teams[tIdx].score) * 0.10);
            return teams; 
          } 
        },
        { 
          id: "minus_all_team", 
          text: "Bomb All Teams -100", 
          icon: `<i data-lucide="bomb" class="w-10 h-10 text-white"></i>`, 
          color: "bg-slate-800 shadow-slate-800/40", 
          action: (teams, tIdx) => { 
            teams.forEach(t => t.score -= 100);
            return teams; 
          } 
        },
        { 
          id: "give_100", 
          text: "Give 100", 
          icon: `<i data-lucide="gift" class="w-10 h-10 text-white"></i>`, 
          color: "bg-pink-500 shadow-pink-500/40", 
          requiresTarget: "give",
          action: (teams, tIdx, targetIdx) => { 
            let amount = Math.min(100, Math.max(0, teams[tIdx].score));
            if (amount > 0) {
              teams[tIdx].score -= amount;
              teams[targetIdx].score += amount;
            }
            return teams; 
          } 
        },
      ];
      
      const getOutcomes = () => {
        if (gameDifficulty === "normal") return OUTCOMES_NORMAL;
        if (gameDifficulty === "medium") return OUTCOMES_MEDIUM;
        return OUTCOMES_DIFFICULT;
      };


      const getTeamStyle = (index) => {
        const styles = [
          {
            text: "text-orange-600",
            bg: "bg-orange-100",
            border: "border-orange-400",
            shadow: "shadow-[0_0_30px_rgba(251,146,60,0.5)]",
            badge: "bg-orange-500",
          },
          {
            text: "text-blue-600",
            bg: "bg-blue-100",
            border: "border-blue-400",
            shadow: "shadow-[0_0_30px_rgba(96,165,250,0.5)]",
            badge: "bg-blue-500",
          },
          {
            text: "text-emerald-600",
            bg: "bg-emerald-100",
            border: "border-emerald-400",
            shadow: "shadow-[0_0_30px_rgba(52,211,153,0.5)]",
            badge: "bg-emerald-500",
          },
          {
            text: "text-fuchsia-600",
            bg: "bg-fuchsia-100",
            border: "border-fuchsia-400",
            shadow: "shadow-[0_0_30px_rgba(232,121,249,0.5)]",
            badge: "bg-fuchsia-500",
          },
        ];
        return styles[index % styles.length];
      };

      // --- GLOBAL STATE ---
      let gameState = "setup"; // 'setup' or 'playing'
      let isMuted = false;

      
      let gameTopic = "";
      let gameClass = "";
      let gameFolder = "";
      let availableFolders = [];
      let gameTheme = "royal";
      let gameDifficulty = "normal"; // royal, space, jungle, ocean
      let genLevel = "A1";
      let genType = "mixed";
      let isGenerating = false;

      let customQuestions = Array.from({ length: 26 }, (_, i) => ({
        letter: String(i + 1),
        type: "mcq",
        question: `Sample Question ${String(i + 1)}`,
        options: ["Option 1", "Option 2", "Option 3", "Option 4"],
        correctOptionIndex: 0,
        answer: `Sample Answer ${String(i + 1)}`,
      }));

      let teams = [
        { id: 0, name: "Team 1", score: 0 },
        { id: 1, name: "Team 2", score: 0 }
      ];
      let currentTeamIdx = 0;
      let openedBoxes = [];

      let activeBox = null;
      let selectedBoxAnimation = null;
      let isModalJustOpened = false;
      let isSettingsOpen = false;
      let isAnswerRevealed = false;
      let selectedOptionIndex = null;
      let currentOutcome = null;
      let modalStep = "question"; // 'question', 'decision', 'target_selection', 'reveal'
      let targetTeamIdx = null;
      let celebration = null;

      // --- ACTIONS ---

      
      const generateQuestions = async () => {
        if (!gameTopic) {
          alert("Please enter a Topic in Game Details first.");
          return;
        }
        isGenerating = true;
        renderApp();
        
        try {
          const res = await fetch("/api/generate-mystery-box-questions", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              topic: gameTopic,
              level: genLevel,
              type: genType
            })
          });
          const data = await res.json();
          if (data.error) throw new Error(data.error);
          
          if (data.questions && data.questions.length === 26) {
            customQuestions = data.questions.map((q, i) => ({
              ...q,
              letter: String(i + 1)
            }));
          } else {
            alert("Failed to generate exactly 26 questions.");
          }
        } catch (e) {
          alert("Error generating questions: " + e.message);
        } finally {
          isGenerating = false;
          renderApp();
        }
      };

      const updateQuestionType = (idx, type) => {

        customQuestions[idx].type = type;
        renderApp();
      };

      const updateCorrectOption = (qIdx, optIdx) => {
        customQuestions[qIdx].correctOptionIndex = optIdx;
        // No re-render needed, native HTML radio handles it visually
      };

      const addTeam = () => {
        teams.push({ id: teams.length, name: `Team ${teams.length + 1}`, score: 0 });
        renderApp();
      };

      const removeTeam = (index) => {
        if (teams.length > 2) {
          teams.splice(index, 1);
          if (currentTeamIdx >= teams.length) {
            currentTeamIdx = 0;
          }
          teams.forEach((t, i) => (t.id = i));
          renderApp();
        }
      };

      const toggleSettings = () => {
        isSettingsOpen = !isSettingsOpen;
        renderApp();
      };
      
      const changeDifficulty = (newDiff) => {
        gameDifficulty = newDiff;
        renderApp();
      };
      
      const changeTheme = (newTheme) => {
        gameTheme = newTheme;
        renderApp();
      };
      
      const startGame = () => {
        playSound("click", isMuted);
        
        const gameData = {
          teams,
          customQuestions,
          topic: gameTopic,
          className: gameClass,
          folder: gameFolder,
          difficulty: gameDifficulty
        };

        window.parent.postMessage(
          { type: "SAVE_MYSTERY_BOX", data: gameData },
          "*",
        );
      };

      const returnToSetup = () => {
        gameState = "setup";
        activeBox = null;
        renderApp();
      };

      const toggleTeam = () => {
        currentTeamIdx = (currentTeamIdx + 1) % teams.length;
      };

      const handleBoxClick = (letter) => {
        if (openedBoxes.includes(letter)) return;
        if (selectedBoxAnimation) return; // Prevent multiple clicks
        
        playSound("click", isMuted);
        selectedBoxAnimation = letter;
        renderApp();
        
        setTimeout(() => {
          playSound("suspense", isMuted);
          activeBox = customQuestions.find((q) => q.letter === letter);
          isAnswerRevealed = false;
          selectedOptionIndex = null;
          currentOutcome = null;
          modalStep = "question";
          targetTeamIdx = null;
          selectedBoxAnimation = null;
          isModalJustOpened = true;
          renderApp();
        }, 800);
      };

      const handleOptionSelect = (index) => {
        if (!isAnswerRevealed) {
          playSound("click", isMuted);
          selectedOptionIndex = index;
          isModalJustOpened = false;
          renderApp();
        }
      };

      const handleReveal = () => {
        playSound("suspense", isMuted);
        playSound("reveal", isMuted);
        isAnswerRevealed = true;
        isModalJustOpened = false;
        renderApp();
      };

      const handleIncorrect = () => {
        playSound("incorrect", isMuted);
        isModalJustOpened = false;
        
        // Show incorrect state briefly
        modalStep = "incorrect_transition";
        renderApp();
        
        setTimeout(() => {
          openedBoxes.push(activeBox.letter);
          activeBox = null;
          toggleTeam();
          renderApp();
          checkGameOver();
        }, 1500);
      };

      const handleCorrect = () => {
        playSound("correct", isMuted);
        isModalJustOpened = false;
        
        // Show correct state briefly
        modalStep = "correct_transition";
        renderApp();
        
        setTimeout(() => {
          modalStep = "decision";
          renderApp();
        }, 1500);
      };

      window.openMediaPicker = (qIdx, oIdx) => {
        window.parent.postMessage({ type: "OPEN_MEDIA_PICKER", data: { qIdx, oIdx } }, "*");
      };
      
      window.removeOptionImage = (qIdx, oIdx) => {
        if (customQuestions[qIdx].optionImages) {
          customQuestions[qIdx].optionImages[oIdx] = null;
          renderApp();
        }
      };

      const handleDecision = (choiceTargetIdx) => {
        targetTeamIdx = choiceTargetIdx;

        const outcomes = getOutcomes();
        const randomOutcome = outcomes[Math.floor(Math.random() * outcomes.length)];
        currentOutcome = randomOutcome;

        const isPositive = !["sub", "lose"].some((prefix) =>
          randomOutcome.id.startsWith(prefix),
        );
        playSound(isPositive ? "win" : "lose", isMuted);

        celebration = isPositive ? "win" : "lose";
        setTimeout(() => {
          celebration = null;
          renderApp();
        }, 3000);

        if (currentOutcome.requiresTarget && teams.length > 1) {
          modalStep = "target_selection";
        } else {
          teams = currentOutcome.action(teams, choiceTargetIdx);
          openedBoxes.push(activeBox.letter);
          modalStep = "reveal";
        }
        renderApp();
      };

      const handleOutcomeTarget = (targetIdx) => {
        if (targetIdx !== null) {
          teams = currentOutcome.action(teams, targetTeamIdx, targetIdx);
        }
        openedBoxes.push(activeBox.letter);
        modalStep = "reveal";
        renderApp();
      };

      const closeReveal = () => {
        activeBox = null;
        toggleTeam();
        renderApp();
        checkGameOver();
      };

      const resetGame = () => {
        teams.forEach((t) => (t.score = 0));
        openedBoxes = [];
        currentTeamIdx = 0;
        activeBox = null;
        celebration = null;
        renderApp();
      };

      const toggleMute = () => {
        isMuted = !isMuted;
        renderApp();
      };

      const getWinners = () => {
        if (teams.length === 0) return [];
        const maxScore = Math.max(...teams.map((t) => t.score));
        return teams.filter((t) => t.score === maxScore);
      };

      const checkGameOver = () => {
        const isGameOver =
          gameState === "playing" &&
          openedBoxes.length === customQuestions.length &&
          activeBox === null;
        if (isGameOver && openedBoxes.length > 0) {
          playSound("grand_win", isMuted);
          renderApp();
        }
      };

      // --- RENDER FUNCTIONS ---

      const renderSetupScreen = () => {
        let teamsHtml = teams
          .map(
            (t, idx) => `
          <div class="flex items-center gap-3 bg-slate-50 border border-slate-200 p-3 rounded-xl focus-within:border-blue-400">
            <div class="font-bold text-slate-400 w-6">${idx + 1}</div>
            <input 
              type="text" 
              value="${t.name.replace(/"/g, "&quot;")}" 
              oninput="teams[${idx}].name = this.value" 
              class="flex-1 bg-transparent outline-none font-medium text-slate-700" 
              placeholder="Team Name"
            />
            ${teams.length > 2 ? `<button onclick="removeTeam(${idx})" class="text-red-400 hover:text-red-600 transition-colors"><i data-lucide="trash-2" class="w-5 h-5"></i></button>` : ''}
          </div>
        `
          )
          .join("");

        let questionsHtml = customQuestions
          .map(
            (q, idx) => `
        <div class="bg-slate-50 p-6 rounded-2xl border border-slate-200">
          <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 gap-4">
            <div class="flex items-center gap-3">
              <div class="bg-blue-500 text-white w-10 h-10 flex items-center justify-center rounded-full font-black text-xl">
                ${idx + 1}
              </div>
              <h3 class="text-lg font-bold text-slate-700">Question Setup</h3>
            </div>
          </div>

          <div class="mb-4">
            <label class="block text-sm font-bold text-slate-500 mb-2">Question</label>
            <textarea 
              oninput="customQuestions[${idx}].question = this.value"
              class="w-full bg-white border border-slate-300 rounded-xl p-3 resize-none h-20 focus:ring-2 focus:ring-blue-400 outline-none font-medium text-slate-700"
            >${q.question}</textarea>
          </div>

            <div>
              <label class="block text-sm font-bold text-slate-500 mb-2">Answers (Select the correct option)</label>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                ${q.options
                  .map(
                    (opt, oIdx) => `
                  <div class="flex items-center gap-3 bg-white border border-slate-200 p-3 rounded-xl focus-within:border-blue-400">
                    <label class="flex items-center gap-3 cursor-pointer select-none">
                      <input 
                        type="radio" 
                        name="q-${idx}-correct"
                        ${q.correctOptionIndex === oIdx ? "checked" : ""} 
                        onchange="updateCorrectOption(${idx}, ${oIdx})" 
                        class="w-5 h-5 accent-blue-500 cursor-pointer" 
                      />
                      <span class="font-bold text-slate-400 w-4">${String(oIdx + 1)}</span>
                    </label>
                    <div class="flex-1 flex gap-2 items-center relative">
                      <input 
                        type="text" 
                        value="${opt.replace(/"/g, "&quot;")}" 
                        oninput="customQuestions[${idx}].options[${oIdx}] = this.value" 
                        class="flex-1 bg-transparent outline-none font-medium text-slate-700" 
                        placeholder="Option ${String(oIdx + 1)}"
                      />
                      ${q.optionImages && q.optionImages[oIdx] ? `
                        <div class="relative w-8 h-8 rounded shrink-0 overflow-hidden group">
                          <img src="${q.optionImages[oIdx]}" class="w-full h-full object-cover" />
                          <button type="button" onclick="removeOptionImage(${idx}, ${oIdx})" class="absolute inset-0 bg-black/50 text-white hidden group-hover:flex items-center justify-center">
                            <i data-lucide="x" class="w-4 h-4"></i>
                          </button>
                        </div>
                      ` : ''}
                      <button type="button" onclick="openMediaPicker(${idx}, ${oIdx})" class="p-2 bg-slate-100 hover:bg-slate-200 rounded-lg text-slate-500 hover:text-blue-500 transition-colors shrink-0" title="Add Image">
                        <i data-lucide="image" class="w-5 h-5"></i>
                      </button>
                    </div>
                  </div>
                `,
                  )
                  .join("")}
              </div>
            </div>
        </div>
      `,
          )
          .join("");

        return `
        <div class="min-h-screen bg-slate-50 p-6 md:p-10 font-sans">
          <div class="max-w-6xl mx-auto">
            <div class="flex flex-col items-center mb-10">
              <h1 class="text-4xl font-black text-slate-800 drop-shadow-sm">Game Setup</h1>
              <p class="text-slate-500 font-bold mt-2">Configure teams and questions</p>
            </div>

            
            <div class="bg-white p-8 rounded-3xl shadow-sm border border-slate-200 mb-8">
              <h2 class="text-2xl font-bold mb-6 text-slate-700">1. Game Details</h2>
              <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div>
                  <label class="block text-sm font-bold text-slate-500 mb-2">Topic</label>
                  <input type="text" oninput="gameTopic = this.value" value="${gameTopic}" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-3 focus:ring-2 focus:ring-blue-400 outline-none font-medium text-slate-700" placeholder="e.g. Present Simple" />
                </div>
                <div>
                  <label class="block text-sm font-bold text-slate-500 mb-2">Class</label>
                  <input type="text" oninput="gameClass = this.value" value="${gameClass}" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-3 focus:ring-2 focus:ring-blue-400 outline-none font-medium text-slate-700" placeholder="e.g. Grade 3" />
                </div>
                <div>
                  <label class="block text-sm font-bold text-slate-500 mb-2">Folder</label>
                  <div class="relative">
                    <select onchange="gameFolder = this.value" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-3 focus:ring-2 focus:ring-blue-400 outline-none font-medium text-slate-700 appearance-none cursor-pointer">
                      <option value="" ${gameFolder === "" ? "selected" : ""}>No Folder (Root)</option>
                      ${availableFolders.map(f => `<option value="${f.name}" ${gameFolder === f.name ? "selected" : ""}>${f.name}</option>`).join("")}
                    </select>
                    <div class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-slate-500">
                      <i data-lucide="chevron-down" class="w-5 h-5"></i>
                    </div>
                  </div>
                </div>

              </div>
            </div>


            <div class="bg-white p-8 rounded-3xl shadow-sm border border-slate-200 mb-8">
              <h2 class="text-2xl font-bold mb-6 text-slate-700">2. Auto-Generate Questions</h2>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                <div>
                  <label class="block text-sm font-bold text-slate-500 mb-2">Cambridge Level</label>
                  <div class="relative">
                    <select onchange="genLevel = this.value" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-3 focus:ring-2 focus:ring-blue-400 outline-none font-medium text-slate-700 appearance-none cursor-pointer">
                      ${["A1", "A2", "B1", "B2", "C1", "C2"].map(l => `<option value="${l}" ${genLevel === l ? "selected" : ""}>${l}</option>`).join("")}
                    </select>
                    <div class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-slate-500">
                      <i data-lucide="chevron-down" class="w-5 h-5"></i>
                    </div>
                  </div>
                </div>
              </div>
              <button onclick="generateQuestions()" ${isGenerating ? "disabled" : ""} class="w-full py-4 bg-purple-600 text-white rounded-xl font-bold text-lg hover:bg-purple-700 transition-colors flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
                ${isGenerating ? '<div class="w-6 h-6 border-4 border-white/20 border-t-white rounded-full animate-spin"></div> Generating...' : '<i data-lucide="sparkles" class="w-5 h-5"></i> Auto-Generate with AI'}
              </button>
            </div>

            <div class="bg-white p-8 rounded-3xl shadow-sm border border-slate-200 mb-8">
              <h2 class="text-2xl font-bold mb-6 text-slate-700">3. Questions List</h2>
              <div class="space-y-6">${questionsHtml}</div>
            </div>

            <div class="sticky bottom-6 mt-8">
              <button onclick="startGame()" class="w-full py-6 bg-green-600 text-white rounded-2xl font-black text-2xl hover:bg-green-700 hover:shadow-xl hover:shadow-green-600/30 transition-all flex items-center justify-center gap-3">
                <i data-lucide="save" class="w-8 h-8"></i> SAVE GAME
              </button>
            </div>
          </div>
          <div class="fixed bottom-4 right-6 text-slate-400/80 font-black text-sm pointer-events-none z-50 select-none drop-shadow-sm uppercase tracking-wider">
            Created by: Teacher Jan
          </div>
        </div>
      `;
      };

      const getThemeStyles = () => {
        switch(gameTheme) {
          case 'space':
            return {
              bg: 'bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-indigo-900 via-slate-900 to-black',
              particles: 'bg-white/40',
              box: 'bg-gradient-to-br from-indigo-500 to-purple-600 border-indigo-300',
              boxHover: 'hover:shadow-indigo-500/50',
              modalBorder: 'border-indigo-400',
              boxContent: `<div class="absolute inset-0 flex items-center justify-center text-7xl opacity-50 group-hover:scale-125 transition-transform duration-500 rotate-12 filter drop-shadow-[0_0_15px_rgba(255,255,255,0.8)]">⭐</div>`,
              letterStyle: 'absolute text-white left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 group-hover:scale-110 transition-transform duration-500 drop-shadow-[0_4px_8px_rgba(0,0,0,0.9)]',
              modalIcon: `<span class="text-4xl drop-shadow-sm">⭐</span>`
            };
          case 'jungle':
            return {
              bg: 'bg-gradient-to-br from-green-900 via-emerald-800 to-green-950',
              particles: 'bg-green-300/40',
              box: 'bg-gradient-to-br from-emerald-500 to-green-600 border-green-300',
              boxHover: 'hover:shadow-green-500/50',
              modalBorder: 'border-green-400',
              boxContent: `<div class="absolute inset-0 flex items-center justify-center text-[7rem] opacity-60 group-hover:scale-125 transition-transform duration-500 -rotate-12">🌿</div>`,
              letterStyle: 'absolute text-white left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 group-hover:scale-110 transition-transform duration-500 drop-shadow-[0_4px_8px_rgba(0,0,0,0.9)]',
              modalIcon: `<span class="text-4xl drop-shadow-sm">🌿</span>`
            };
          case 'ocean':
            return {
              bg: 'bg-gradient-to-b from-cyan-900 via-blue-900 to-blue-950',
              particles: 'bg-cyan-200/40 rounded-full',
              box: 'bg-gradient-to-br from-cyan-400 to-blue-600 border-cyan-200',
              boxHover: 'hover:shadow-cyan-400/50',
              modalBorder: 'border-cyan-300',
              boxContent: `<div class="absolute inset-0 flex items-center justify-center text-[6rem] opacity-60 group-hover:scale-125 transition-transform duration-500 -rotate-45 ml-2 mt-4">🏄‍♂️</div>`,
              letterStyle: 'absolute text-white left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 group-hover:scale-110 transition-transform duration-500 drop-shadow-[0_4px_8px_rgba(0,0,0,0.9)]',
              modalIcon: `<span class="text-4xl drop-shadow-sm">🏄‍♂️</span>`
            };
          case 'royal':
          default:
            return {
              bg: 'bg-gradient-to-br from-indigo-900 via-purple-700 to-indigo-900',
              particles: 'bg-white/20 rounded-full',
              box: 'bg-gradient-to-br from-purple-500 to-indigo-600 border-purple-300',
              boxHover: 'hover:shadow-purple-400/50 hover:scale-105',
              modalBorder: 'border-purple-300',
              boxContent: `<div class="absolute inset-0 bg-gradient-to-br from-white/10 to-transparent"></div>`,
              letterStyle: 'absolute text-white left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 group-hover:scale-110 transition-transform duration-500 drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)]',
              modalIcon: `<span class="text-4xl drop-shadow-sm">✨</span>`
            };
        }
      };

      const renderGameScreen = () => {
        const theme = getThemeStyles();
        const isGameOver =
          openedBoxes.length === customQuestions.length && activeBox === null;
        let shakeClass = celebration === "lose" ? "animate-shake" : "";

        let teamsHeaderHtml = teams
          .map((team, idx) => {
            const isCurrent = currentTeamIdx === idx;
            const style = getTeamStyle(idx);
            return `
          <div class="px-4 md:px-8 py-3 md:py-4 rounded-xl border-4 transition-all duration-300 min-w-[120px] md:min-w-[180px] text-center ${
            isCurrent
              ? `${style.border} ${style.bg} scale-110 ${style.shadow} z-10`
              : "border-transparent bg-white/10"
          }">
            <p class="text-sm md:text-xl font-black uppercase tracking-wider mb-1 ${isCurrent ? style.text : "text-white/60"}">${team.name}</p>
            <p class="text-4xl md:text-6xl font-black drop-shadow-sm transition-all ${isCurrent ? style.text : "text-white/80"}">
              ${team.score > 0 ? "+" : ""}${team.score}
            </p>
          </div>
          ${idx < teams.length - 1 ? `<div class="text-white/30 font-black text-xl md:text-3xl">VS</div>` : ""}
        `;
          })
          .join("");

        let gridHtml = customQuestions
          .map((box) => {
            const isOpened = openedBoxes.includes(box.letter);
            const isAnimating = selectedBoxAnimation === box.letter;
            const otherIsAnimating = selectedBoxAnimation && selectedBoxAnimation !== box.letter;
            
            return `
          <button
            onclick="handleBoxClick('${box.letter}')"
            onmouseenter="playSound('hover', isMuted)"
            ${isOpened || selectedBoxAnimation ? "disabled" : ""}
            class="relative overflow-hidden group aspect-square rounded-[2rem] flex flex-col items-center justify-center text-2xl sm:text-3xl md:text-4xl font-black shadow-xl transition-all duration-700
              ${
                isOpened
                  ? "bg-white/40 text-slate-400/50 cursor-not-allowed border-2 border-white/50 shadow-inner scale-95"
                  : isAnimating 
                    ? "${theme.box} text-white border-4 scale-[1.5] z-50 shadow-[0_0_100px_rgba(255,255,255,0.8)] opacity-100 rotate-[360deg]"
                    : otherIsAnimating
                      ? "${theme.box} text-white opacity-20 blur-sm scale-90 border-4"
                      : "${theme.box} animate-box-glow text-white hover:-translate-y-2 hover:shadow-2xl ${theme.boxHover} border-4 active:scale-95"
              }
            "
          >
            ${!isOpened ? theme.boxContent : ""}
            <span class="z-10 font-black text-5xl md:text-6xl ${!isOpened ? theme.letterStyle : 'relative text-slate-500/50 drop-shadow-none'}">${box.letter}</span>
          </button>
        `;
          })
          .join("");

        // Modal HTML
        let modalHtml = "";
        if (activeBox) {
          let modalInner = "";
          if (modalStep === "question") {
            let mcqOptionsHtml = "";
            if (activeBox.type === "mcq") {
              mcqOptionsHtml = `
              <div class="grid grid-cols-1 md:grid-cols-2 gap-6 lg:gap-8 mt-12 max-w-6xl mx-auto">
                ${activeBox.options
                  .map((opt, i) => {
                    let optionStyle =
                      "bg-white border-slate-200 text-slate-600";
                    if (!isAnswerRevealed) {
                      if (selectedOptionIndex === i) {
                        optionStyle =
                          "bg-blue-100 border-blue-500 text-blue-800 shadow-lg scale-[1.02]";
                      } else {
                        optionStyle +=
                          " hover:border-blue-300 hover:bg-blue-50 cursor-pointer";
                      }
                    } else {
                      if (activeBox.correctOptionIndex === i) {
                        optionStyle =
                          "bg-green-100 border-green-500 text-green-700 scale-[1.03] shadow-2xl z-10";
                      } else if (selectedOptionIndex === i) {
                        optionStyle =
                          "bg-red-100 border-red-500 text-red-700 opacity-90";
                      } else {
                        optionStyle =
                          "bg-white border-slate-200 text-slate-500 opacity-40";
                      }
                    }
                    const imgHtml = activeBox.optionImages && activeBox.optionImages[i] ? `<div class="w-24 h-24 md:w-40 md:h-40 rounded-2xl overflow-hidden shrink-0 ml-4"><img src="${activeBox.optionImages[i]}" class="w-full h-full object-cover shadow-md border-4 border-white/50" /></div>` : '';
                    return `
                    <button 
                      onclick="handleOptionSelect(${i})"
                      ${isAnswerRevealed ? "disabled" : ""}
                      class="p-6 md:p-8 rounded-3xl text-3xl md:text-5xl lg:text-6xl font-bold border-[4px] transition-all flex flex-col sm:flex-row items-center sm:items-start text-left w-full gap-4 ${optionStyle}"
                    >
                      <div class="flex items-center flex-1 w-full">
                        <span class="mr-4 md:mr-6 opacity-50 shrink-0">${String(i + 1)}.</span> 
                        <span class="flex-1 break-words">${opt}</span>
                      </div>
                      ${imgHtml}
                    </button>
                  `;
                  })
                  .join("")}
              </div>
            `;
            }

            let fibHtml = "";
            if (activeBox.type === "fib" && isAnswerRevealed) {
              fibHtml = `
              <div class="mt-12 p-8 md:p-10 bg-green-50 border-[4px] border-green-400 rounded-[2rem] animate-in fade-in duration-300">
                <span class="text-green-700 font-black text-4xl md:text-6xl lg:text-7xl">Answer: ${activeBox.answer}</span>
              </div>
            `;
            }

            let controlsHtml = !isAnswerRevealed
              ? `
            <button onclick="handleReveal()" class="mx-auto flex items-center gap-4 px-12 py-6 bg-blue-500 hover:bg-blue-600 text-white rounded-3xl font-black text-3xl shadow-xl hover:shadow-blue-500/40 transition-all hover:-translate-y-1">
              <i data-lucide="eye" class="w-8 h-8"></i> Reveal Answer
            </button>
          `
              : `
            <div class="flex flex-col sm:flex-row justify-center gap-6 animate-in fade-in zoom-in duration-300">
              <button onclick="handleIncorrect()" class="flex-1 max-w-[350px] mx-auto sm:mx-0 flex items-center justify-center gap-3 px-8 py-6 bg-white hover:bg-red-50 text-slate-600 hover:text-red-600 border-[4px] border-slate-200 hover:border-red-300 rounded-3xl font-black text-3xl transition-all">
                <i data-lucide="x" class="w-10 h-10"></i> INCORRECT
              </button>
              <button onclick="handleCorrect()" class="flex-1 max-w-[350px] mx-auto sm:mx-0 flex items-center justify-center gap-3 px-8 py-6 bg-green-500 hover:bg-green-600 text-white rounded-3xl font-black text-3xl shadow-xl hover:shadow-green-500/40 transition-all hover:-translate-y-1">
                <i data-lucide="check" class="w-10 h-10"></i> CORRECT
              </button>
            </div>
          `;

            modalInner = `
            <p class="text-2xl font-black text-blue-500 uppercase tracking-widest mb-6">QUESTION</p>
            <div class="bg-slate-50 rounded-[3rem] p-10 md:p-14 mb-8 shadow-inner border border-slate-100">
              <h3 class="text-5xl md:text-7xl lg:text-8xl font-extrabold text-slate-800 leading-tight whitespace-pre-wrap">${activeBox.question}</h3>
              ${mcqOptionsHtml}
              ${fibHtml}
            </div>
            ${controlsHtml}
          `;
          } else if (modalStep === "correct_transition") {
            modalInner = `
              <div class="flex flex-col items-center justify-center p-12 py-24 animate-in zoom-in duration-500 text-green-500">
                <div class="w-32 h-32 bg-green-100 rounded-full flex items-center justify-center mb-8 shadow-inner animate-bounce">
                  <i data-lucide="check" class="w-20 h-20 text-green-500" stroke-width="3"></i>
                </div>
                <h3 class="text-6xl md:text-8xl font-black drop-shadow-sm uppercase tracking-widest">CORRECT!</h3>
              </div>
            `;
          } else if (modalStep === "incorrect_transition") {
            modalInner = `
              <div class="flex flex-col items-center justify-center p-12 py-24 animate-in zoom-in duration-500 text-red-500">
                <div class="w-32 h-32 bg-red-100 rounded-full flex items-center justify-center mb-8 shadow-inner animate-shake">
                  <i data-lucide="x" class="w-20 h-20 text-red-500" stroke-width="3"></i>
                </div>
                <h3 class="text-6xl md:text-8xl font-black drop-shadow-sm uppercase tracking-widest">INCORRECT</h3>
              </div>
            `;
          } else if (modalStep === "decision") {
            let giveButtonsHtml = "";
            if (teams.length === 2) {
              giveButtonsHtml = `
              <button onclick="handleDecision(${(currentTeamIdx + 1) % 2})" class="flex-1 flex flex-col items-center justify-center gap-3 px-6 py-8 bg-[#faf5ff] hover:bg-[#f3e8ff] text-[#a855f7] border-[3px] border-[#c084fc] rounded-[1.5rem] transition-all hover:-translate-y-1 shadow-sm">
                <div class="flex items-center gap-3 font-black text-3xl">
                  <i data-lucide="arrow-right-left" class="w-8 h-8" stroke-width="2.5"></i> GIVE IT AWAY
                </div>
                <span class="text-sm font-bold opacity-80">(Applies to ${teams[(currentTeamIdx + 1) % 2].name})</span>
              </button>
            `;
            } else {
              giveButtonsHtml = `
              <div class="flex-1 flex flex-col bg-[#faf5ff] border-[3px] border-[#c084fc] rounded-[1.5rem] p-4">
                <div class="flex items-center justify-center gap-2 font-black text-xl text-[#a855f7] mb-3">
                  <i data-lucide="arrow-right-left" class="w-6 h-6"></i> GIVE TO:
                </div>
                <div class="flex flex-wrap justify-center gap-3">
                  ${teams
                    .map((t, i) => {
                      if (i === currentTeamIdx) return "";
                      return `<button onclick="handleDecision(${i})" class="flex-1 min-w-[100px] flex items-center justify-center py-3 bg-white hover:bg-purple-100 text-[#a855f7] rounded-xl font-bold text-lg transition-all shadow-sm border border-purple-200">${t.name}</button>`;
                    })
                    .join("")}
                </div>
              </div>
            `;
            }

            modalInner = `
            <div class="animate-in zoom-in-50 duration-500 ease-out bg-white rounded-[2rem] px-4 py-6 md:p-8">
              <p class="text-xl md:text-2xl font-black text-[#3b82f6] uppercase tracking-widest mb-8">Decision Time!</p>
              <div class="mb-10 p-6 md:p-8 bg-white border shadow-[0_0_15px_rgba(0,0,0,0.05)] rounded-3xl">
                <h3 class="text-3xl md:text-4xl font-extrabold text-slate-900 mb-4">You answered correctly! 🎉</h3>
                <p class="text-xl md:text-2xl font-medium text-slate-600">
                  Do you want to <span class="font-black text-[#f97316]">KEEP</span> the mystery box, or <span class="font-black text-[#a855f7]">GIVE</span> it away?
                </p>
              </div>
              <div class="flex flex-col md:flex-row justify-center gap-6">
                <button onclick="handleDecision(${currentTeamIdx})" class="flex-1 flex flex-col items-center justify-center gap-3 px-6 py-8 bg-[#fff8f1] hover:bg-[#ffedd5] text-[#f97316] border-[3px] border-[#fb923c] rounded-[1.5rem] transition-all hover:-translate-y-1 shadow-sm">
                  <div class="flex items-center gap-3 font-black text-3xl">
                    ${theme.modalIcon} KEEP IT
                  </div>
                  <span class="text-sm font-bold opacity-80">(Applies to ${teams[currentTeamIdx].name})</span>
                </button>
                ${giveButtonsHtml}
              </div>
            </div>
          `;
          } else if (modalStep === "target_selection") {
            let actionWord = "CHOOSE TEAM:";
            if (currentOutcome.requiresTarget === "swap") actionWord = "SWAP WITH:";
            else if (currentOutcome.requiresTarget === "steal") actionWord = "STEAL FROM:";
            else if (currentOutcome.requiresTarget === "give") actionWord = "GIVE TO:";

            modalInner = `
            <div class="animate-in zoom-in-90 duration-500 relative z-10">
              <p class="text-xl md:text-2xl font-black text-[#3b82f6] uppercase tracking-widest mb-6">Mystery Box Revealed</p>
              <div class="mb-8 mx-auto w-full max-w-lg ${currentOutcome.color} rounded-[2rem] p-8 shadow-xl flex flex-col items-center gap-4 border-[6px] border-white">
                <div class="bg-white/20 p-4 rounded-full shadow-inner backdrop-blur-sm">
                  ${currentOutcome.icon}
                </div>
                <h3 class="text-4xl font-black text-white text-center drop-shadow-md leading-tight">
                  ${currentOutcome.text}
                </h3>
              </div>
              <div class="mb-6 p-6 md:p-8 bg-white border shadow-[0_0_15px_rgba(0,0,0,0.05)] rounded-3xl">
                <div class="flex items-center justify-center gap-2 font-black text-xl text-slate-700 mb-6 uppercase">
                  ${actionWord}
                </div>
                <div class="flex flex-wrap justify-center gap-4">
                  ${teams.map((t, i) => {
                      if (i === targetTeamIdx) return "";
                      return `<button onclick="handleOutcomeTarget(${i})" class="flex-1 min-w-[120px] py-4 px-6 bg-white hover:bg-slate-50 text-slate-800 rounded-2xl font-bold text-xl transition-all shadow-sm border-2 border-slate-200 hover:border-[#a855f7] hover:text-[#a855f7]">${t.name}</button>`;
                    }).join("")}
                </div>
              </div>
              <button onclick="handleOutcomeTarget(null)" class="w-full px-6 py-4 bg-slate-100 text-slate-500 hover:bg-slate-200 hover:text-slate-700 rounded-2xl font-bold text-lg transition-all">
                Cancel
              </button>
            </div>
            `;
          } else if (modalStep === "reveal") {
            let revealConfetti = '';
            if (currentOutcome.id.startsWith('add')) {
              revealConfetti = `<div class="absolute inset-0 pointer-events-none z-0 overflow-hidden">
                ${Array.from({ length: 30 }).map(() => `
                  <div class="absolute text-4xl animate-float-up" style="left: ${Math.random() * 100}%; bottom: 0; animation-duration: ${1 + Math.random()}s; animation-delay: 0s;">
                    ✨
                  </div>
                `).join('')}
              </div>`;
            } else if (currentOutcome.id.startsWith('sub') || currentOutcome.id.startsWith('minus')) {
              revealConfetti = `<div class="absolute inset-0 pointer-events-none z-0 overflow-hidden">
                ${Array.from({ length: 20 }).map(() => `
                  <div class="absolute text-4xl animate-drop-down" style="left: ${Math.random() * 100}%; top: -10%; animation-duration: ${1 + Math.random()}s; animation-delay: 0s;">
                    💀
                  </div>
                `).join('')}
              </div>`;
            }

            modalInner = `
            ${revealConfetti}
            <div class="animate-in zoom-in-90 duration-500 relative z-10">

              <p class="text-xl font-black text-slate-400 uppercase tracking-widest mb-4">Mystery Box Revealed</p>
              <div class="mt-6 mb-8 mx-auto w-full max-w-lg ${currentOutcome.color} rounded-[2rem] p-12 shadow-xl flex flex-col items-center gap-6 transform transition-all hover:scale-105 border-[6px] border-white">
                <div class="bg-white/20 p-6 rounded-full shadow-inner backdrop-blur-sm">
                  ${currentOutcome.icon}
                </div>
                <h3 class="text-5xl md:text-6xl font-black text-white text-center drop-shadow-md leading-tight">
                  ${currentOutcome.text}
                </h3>
              </div>
              <p class="text-2xl font-bold text-slate-600 mb-8">
                Applied to: <span class="px-4 py-1 rounded-xl text-white ${getTeamStyle(targetTeamIdx).badge}">${teams[targetTeamIdx].name}</span>
              </p>
              <button onclick="closeReveal()" class="w-full sm:w-auto px-16 py-5 bg-white text-slate-900 hover:bg-slate-200 rounded-2xl font-black text-2xl shadow-xl transition-all hover:-translate-y-1">
                Continue
              </button>
            </div>
          `;
          }

          const backdropAnimation = isModalJustOpened ? "animate-in fade-in duration-500" : "";
          const popupAnimation = isModalJustOpened ? "animate-in zoom-in-75 slide-in-from-bottom-10 duration-500 ease-out" : "";

          modalHtml = `
          <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/70 backdrop-blur-lg overflow-y-auto ${backdropAnimation}">
            <div class="bg-white border-[6px] ${theme.modalBorder} rounded-[3rem] p-8 md:p-12 max-w-[90vw] xl:max-w-7xl w-full shadow-2xl relative my-auto ${popupAnimation}">
              <div class="absolute -top-12 left-1/2 -translate-x-1/2">
                <div class="bg-gradient-to-br from-yellow-400 to-orange-500 text-white w-24 h-24 rounded-full flex items-center justify-center text-5xl font-black shadow-lg border-[6px] border-white">
                  ${activeBox.letter}
                </div>
              </div>
              <div class="mt-8 text-center">${modalInner}</div>
              <button onclick="activeBox=null; renderApp();" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 transition-colors bg-slate-100 hover:bg-slate-200 rounded-full p-2">
                <i data-lucide="x" class="w-6 h-6"></i>
              </button>
            </div>
          </div>
        `;
        }

        // Visual Effects Html
        let visualEffectsHtml = "";
        if (celebration === "win") {
          let confettis = Array.from({ length: 40 })
            .map(
              () => `
          <div class="absolute text-5xl md:text-6xl animate-float-up" style="left: ${Math.random() * 100}%; bottom: -10%; animation-delay: ${Math.random() * 0.5}s; animation-duration: ${1.5 + Math.random()}s">
            ${["🎉", "✨", "🥳", "🌟", "💸", "🏆"][Math.floor(Math.random() * 6)]}
          </div>
        `,
            )
            .join("");
          visualEffectsHtml = `<div class="fixed inset-0 pointer-events-none z-[100] flex items-center justify-center overflow-hidden">${confettis}</div>`;
        } else if (celebration === "lose") {
          let drops = Array.from({ length: 30 })
            .map(
              () => `
          <div class="absolute text-5xl md:text-6xl animate-drop-down" style="left: ${Math.random() * 100}%; top: -10%; animation-delay: ${Math.random() * 0.3}s; animation-duration: ${1 + Math.random()}s">
            ${["🌧️", "💀", "📉", "💔", "⚡", "💣"][Math.floor(Math.random() * 6)]}
          </div>
        `,
            )
            .join("");
          visualEffectsHtml = `<div class="fixed inset-0 pointer-events-none z-[100] bg-red-900/20 flex items-center justify-center overflow-hidden transition-colors duration-500">${drops}</div>`;
        }

        // Game Over Html

        let settingsModalHtml = "";
        if (isSettingsOpen) {
          settingsModalHtml = `
          <div class="fixed inset-0 z-[150] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-md">
            <div class="bg-white rounded-[2rem] p-8 max-w-md w-full shadow-2xl relative animate-in zoom-in-95 duration-200 border-[6px] border-indigo-100">
              <h2 class="text-3xl font-black text-slate-800 mb-6 flex items-center gap-3">
                <i data-lucide="settings" class="w-8 h-8 text-indigo-500"></i> Settings
              </h2>
              
              <div class="space-y-6 max-h-[60vh] overflow-y-auto pr-2">
                <div>
                  <div class="flex justify-between items-center mb-3">
                    <label class="block text-sm font-bold text-slate-500">Teams</label>
                    <button onclick="addTeam()" class="text-xs font-bold bg-blue-100 text-blue-700 hover:bg-blue-200 px-2 py-1 rounded-md transition-colors flex items-center gap-1">
                      <i data-lucide="plus" class="w-3 h-3"></i> Add
                    </button>
                  </div>
                  <div class="space-y-2">
                    ${teams.map((t, idx) => `
                      <div class="flex items-center gap-2 bg-slate-50 border border-slate-200 p-2 rounded-lg focus-within:border-blue-400">
                        <div class="font-bold text-slate-400 w-4 text-sm">${idx + 1}</div>
                        <input 
                          type="text" 
                          value="${t.name.replace(/"/g, "&quot;")}" 
                          oninput="teams[${idx}].name = this.value" 
                          class="flex-1 bg-transparent outline-none font-medium text-slate-700 text-sm" 
                          placeholder="Team Name"
                        />
                        ${teams.length > 2 ? `<button onclick="removeTeam(${idx})" class="text-red-400 hover:text-red-600 p-1"><i data-lucide="trash-2" class="w-4 h-4"></i></button>` : ''}
                      </div>
                    `).join("")}
                  </div>
                </div>
                
                <div>
                  <label class="block text-sm font-bold text-slate-500 mb-3">Difficulty</label>
                  <div class="grid grid-cols-3 gap-2 mb-6">
                    <button onclick="changeDifficulty('normal')" class="p-2 text-center rounded-xl border-[3px] transition-all font-bold text-sm ${gameDifficulty === 'normal' ? 'border-green-500 bg-green-50 text-green-700 shadow-sm' : 'border-slate-200 text-slate-600 hover:border-green-300'}">Normal</button>
                    <button onclick="changeDifficulty('medium')" class="p-2 text-center rounded-xl border-[3px] transition-all font-bold text-sm ${gameDifficulty === 'medium' ? 'border-orange-500 bg-orange-50 text-orange-700 shadow-sm' : 'border-slate-200 text-slate-600 hover:border-orange-300'}">Medium</button>
                    <button onclick="changeDifficulty('difficult')" class="p-2 text-center rounded-xl border-[3px] transition-all font-bold text-sm ${gameDifficulty === 'difficult' ? 'border-red-500 bg-red-50 text-red-700 shadow-sm' : 'border-slate-200 text-slate-600 hover:border-red-300'}">Difficult</button>
                  </div>
                </div>

                <div>
                  <label class="block text-sm font-bold text-slate-500 mb-3">Theme</label>
                  <div class="grid grid-cols-2 gap-3">
                    <button onclick="changeTheme('royal')" class="p-3 text-left rounded-xl border-[3px] transition-all font-bold ${gameTheme === 'royal' ? 'border-indigo-500 bg-indigo-50 text-indigo-700 shadow-sm' : 'border-slate-200 text-slate-600 hover:border-indigo-300'}">👑 Royal Treasury</button>
                    <button onclick="changeTheme('space')" class="p-3 text-left rounded-xl border-[3px] transition-all font-bold ${gameTheme === 'space' ? 'border-indigo-500 bg-indigo-50 text-indigo-700 shadow-sm' : 'border-slate-200 text-slate-600 hover:border-indigo-300'}">🚀 Cosmic</button>
                    <button onclick="changeTheme('jungle')" class="p-3 text-left rounded-xl border-[3px] transition-all font-bold ${gameTheme === 'jungle' ? 'border-indigo-500 bg-indigo-50 text-indigo-700 shadow-sm' : 'border-slate-200 text-slate-600 hover:border-indigo-300'}">🌴 Jungle</button>
                    <button onclick="changeTheme('ocean')" class="p-3 text-left rounded-xl border-[3px] transition-all font-bold ${gameTheme === 'ocean' ? 'border-indigo-500 bg-indigo-50 text-indigo-700 shadow-sm' : 'border-slate-200 text-slate-600 hover:border-indigo-300'}">🌊 Ocean</button>
                  </div>
                </div>

                <div>
                  <label class="block text-sm font-bold text-slate-500 mb-3">Audio</label>
                  <button onclick="toggleMute()" class="w-full p-4 text-left rounded-xl border-[3px] transition-all font-bold flex items-center justify-between ${!isMuted ? 'border-green-500 bg-green-50 text-green-700 shadow-sm' : 'border-slate-200 text-slate-500'}">
                    <span class="flex items-center gap-2">
                      ${!isMuted ? '<i data-lucide="volume-2" class="w-6 h-6"></i> Sound Enabled' : '<i data-lucide="volume-x" class="w-6 h-6"></i> Sound Muted'}
                    </span>
                    <div class="w-14 h-8 rounded-full transition-colors relative ${!isMuted ? 'bg-green-500' : 'bg-slate-300'}">
                      <div class="absolute top-1 bottom-1 w-6 bg-white rounded-full transition-all ${!isMuted ? 'left-7' : 'left-1'}"></div>
                    </div>
                  </button>
                </div>
              </div>

              <button onclick="toggleSettings()" class="mt-8 w-full py-4 bg-slate-800 text-white rounded-xl font-black text-xl hover:bg-slate-700 transition-colors shadow-lg active:scale-95">
                Done
              </button>
              
              <button onclick="toggleSettings()" class="absolute top-6 right-6 text-slate-400 hover:text-slate-600 p-2 bg-slate-100 hover:bg-slate-200 rounded-full transition-colors">
                <i data-lucide="x" class="w-6 h-6"></i>
              </button>
            </div>
          </div>
          `;
        }

        let gameOverHtml = "";
        if (isGameOver) {
          let confettis = Array.from({ length: 80 })
            .map(
              () => `
          <div class="absolute text-4xl md:text-5xl animate-confetti" style="left: ${Math.random() * 100}%; top: -20%; animation-delay: ${Math.random() * 5}s; animation-duration: ${2 + Math.random() * 3}s">
            ${["🎉", "✨", "🥳", "🌟", "🏆", "🎊"][Math.floor(Math.random() * 6)]}
          </div>
        `,
            )
            .join("");

          const winners = getWinners();
          let winnerInner = "";
          if (winners.length > 1) {
            winnerInner = `
            <div class="text-8xl mb-6">🤝</div>
            <h3 class="text-5xl md:text-6xl font-black text-slate-800">It's a TIE!</h3>
            <p class="text-2xl text-slate-500 font-bold mt-4">${winners.map((w) => w.name).join(" & ")} scored ${winners[0].score} points!</p>
          `;
          } else if (winners.length === 1) {
            const winner = winners[0];
            winnerInner = `
            <div class="text-8xl mb-6 animate-bounce">🏆</div>
            <h3 class="text-5xl md:text-7xl font-black mb-4 uppercase"><span class="${getTeamStyle(winner.id).text}">${winner.name}</span> WINS!</h3>
            <p class="text-3xl text-slate-600 font-bold">Final Score: <span class="text-slate-800 font-black">${winner.score}</span></p>
          `;
          }

          gameOverHtml = `
          <div class="fixed inset-0 z-[120] flex items-center justify-center p-4 bg-slate-900/80 backdrop-blur-sm">
            <div class="absolute inset-0 pointer-events-none overflow-hidden">${confettis}</div>
            <div class="bg-white rounded-[3rem] p-12 max-w-3xl w-full shadow-[0_0_100px_rgba(251,191,36,0.6)] relative flex flex-col items-center animate-in zoom-in duration-700 text-center border-[6px] border-yellow-400">
              <h2 class="text-4xl font-black text-slate-400 uppercase tracking-widest mb-6">Game Over</h2>
              <div class="mb-10 w-full">${winnerInner}</div>
              <div class="flex gap-4 w-full">
                <button onclick="resetGame()" class="flex-1 px-12 py-5 bg-gradient-to-r from-orange-400 to-yellow-500 hover:from-orange-500 hover:to-yellow-600 text-white rounded-2xl font-black text-2xl shadow-xl transition-all hover:scale-105">Play Again</button>
              </div>
            </div>
          </div>
        `;
        }

        return `
        <div class="min-h-screen ${theme.bg} pb-10 ${shakeClass}">

          <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
            ${Array.from({ length: 20 }).map(() => `
              <div class="absolute w-2 h-2 ${theme.particles} animate-float-up" 
                   style="left: ${Math.random() * 100}%; top: ${Math.random() * 100}%; animation-duration: ${3 + Math.random() * 4}s; animation-delay: ${Math.random() * 5}s; animation-iteration-count: infinite;">
              </div>
            `).join('')}
          </div>

          
          <header class="p-4 md:p-6 bg-white/10 backdrop-blur-md shadow-lg shadow-black/20 mb-8 border-b border-white/10 flex flex-col xl:flex-row justify-between items-center gap-6 z-10 relative">
            <div class="flex items-center gap-3">
              <div class="bg-yellow-400 p-2 rounded-full shadow-lg shadow-yellow-400/40">
                <i data-lucide="sun" class="w-8 h-8 text-white"></i>
              </div>
              <h1 class="text-3xl md:text-4xl font-black text-white drop-shadow-sm hidden md:block">
                Mystery Box
              </h1>
            </div>

            <div class="flex items-center justify-center gap-2 md:gap-4 bg-white/5 p-2 md:p-3 rounded-2xl shadow-inner border border-white/10 flex-wrap">
              ${teamsHeaderHtml}
            </div>

            <div class="flex items-center gap-3">
              <button onclick="resetGame()" class="p-3 bg-white/10 text-white hover:bg-red-500 hover:text-white rounded-xl shadow-md transition-colors" title="Reset Scores">
                <i data-lucide="refresh-cw" class="w-6 h-6"></i>
              </button>
              <button onclick="toggleSettings()" class="flex items-center gap-2 px-5 py-3 bg-white text-slate-900 hover:bg-slate-200 rounded-xl shadow-md transition-colors font-bold">
                <i data-lucide="settings" class="w-5 h-5"></i> Settings
              </button>
            </div>
          </header>

          <main class="max-w-7xl mx-auto px-4">
            <div class="text-center mb-10">
              <div class="inline-block bg-white/10 backdrop-blur-md border border-white/20 rounded-full p-2 pr-6 shadow-xl shadow-black/20 transform transition-all hover:scale-105">
                <h2 class="text-xl md:text-2xl font-bold text-white flex items-center gap-4">
                  <span class="px-6 py-2 rounded-full text-white font-black shadow-md ${getTeamStyle(currentTeamIdx).badge}">
                    ${teams[currentTeamIdx]?.name.toUpperCase()} TURN
                  </span>
                  Pick a Mystery Box!
                </h2>
              </div>
            </div>

            <div class="grid grid-cols-4 sm:grid-cols-5 md:grid-cols-6 lg:grid-cols-7 gap-3 md:gap-4 justify-center max-w-6xl mx-auto">
              ${gridHtml}
            </div>
          </main>

          ${modalHtml}
          ${visualEffectsHtml}
          ${gameOverHtml}
            ${settingsModalHtml}

          <div class="fixed bottom-4 right-6 text-white/60 font-black text-sm pointer-events-none z-50 select-none drop-shadow-sm uppercase tracking-wider">
            Created by: Teacher Jan
          </div>
        </div>
      `;
      };

      const renderApp = () => {
        const root = document.getElementById("app-root");
        if (gameState === "setup") {
          root.innerHTML = renderSetupScreen();
        } else {
          root.innerHTML = renderGameScreen();
        }
        lucide.createIcons(); // Initialize all Lucide icons after rendering
      };

      // Initialize App
      renderApp();

            window.addEventListener("message", (event) => {
        if (event.data?.type === "MEDIA_PICKED") {
          const { qIdx, oIdx, url } = event.data.data;
          if (!customQuestions[qIdx].optionImages) {
            customQuestions[qIdx].optionImages = [null, null, null, null];
          }
          customQuestions[qIdx].optionImages[oIdx] = url;
          renderApp();
          return;
        }
        if (event.data?.type === "MEDIA_PICKED") {
          const { qIdx, oIdx, url } = event.data.data;
          if (!customQuestions[qIdx].optionImages) {
            customQuestions[qIdx].optionImages = [null, null, null, null];
          }
          customQuestions[qIdx].optionImages[oIdx] = url;
          renderApp();
          return;
        }
        if (event.data?.type === "SET_FOLDERS") {
          availableFolders = event.data.data;
          if (gameState === "setup") renderApp();
        }
        if (event.data?.type === "LOAD_MYSTERY_BOX") {
          const gameData = event.data.data;
          console.log("LOAD_MYSTERY_BOX", gameData);
          
          gameTopic = gameData.topic || "";
          gameClass = gameData.className || "";
          gameFolder = gameData.folder || "";
          gameTheme = gameData.theme || "royal";
          gameDifficulty = gameData.difficulty || "normal";

          customQuestions = gameData.customQuestions || customQuestions;
          
          if (gameData.teams && gameData.teams.length > 0) {
            teams = gameData.teams.map((t, idx) => ({ ...t, id: idx, score: 0 }));
          } else {
            const count = gameData.setupTeamCount || 2;
            teams = Array.from({ length: count }, (_, i) => ({
              id: i,
              name: `Team ${i + 1}`,
              score: 0,
            }));
          }
          currentTeamIdx = 0;
          openedBoxes = [];
          if (gameData.editMode) {
            gameState = "setup";
          } else {
            gameState = "playing";
          }
          renderApp();
        }
      });
    </script>
  </body>
</html>
